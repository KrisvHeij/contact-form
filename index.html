<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>

    <main class="form-container">
      <h1>Contact Us</h1>
      <form>
        <div class="flex-container">
          <div class="form-group">
            <label for="firstName"
              >First Name
              <span class="required-icon" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              name="firstName"
              id="firstName"
              class="input-text input"
              required
            />
            <p class="error-message error-first-name" aria-hidden="true" hidden>
              This field is required
            </p>
          </div>
          <div class="form-group">
            <label for="lastName"
              >Last Name
              <span class="required-icon" aria-hidden="true">*</span></label
            >
            <input
              type="text"
              name="lastName"
              id="lastName"
              class="input-text input"
              required
            />
            <p class="error-message error-last-name" aria-hidden="true" hidden>
              This field is required
            </p>
          </div>
        </div>
        <div class="form-group">
          <label for="email"
            >Email Address
            <span class="required-icon" aria-hidden="true">*</span></label
          >
          <input
            type="email"
            name="email"
            id="email"
            class="input-email input"
            required
          />
          <p class="error-message error-email" aria-hidden="true" hidden>
            This field is required
          </p>
        </div>
        <fieldset class="flex-container">
          <legend>
            Query Type <span class="required-icon" aria-hidden="true">*</span>
          </legend>
          <div class="form-group-radio">
            <input
              type="radio"
              name="queryType"
              id="generalQuery"
              class="input-radio"
              value="generalQuery"
            />
            <label for="generalQuery">General Enquiry</label>
          </div>
          <div class="form-group-radio">
            <input
              type="radio"
              name="queryType"
              id="supportQuery"
              class="input-radio"
              value="supportQuery"
            />
            <label for="supportQuery">Support Request</label>
          </div>
          <p class="error-message error-query" aria-hidden="true" hidden>
            Please select a query type
          </p>
        </fieldset>
        <div class="form-group">
          <label for="message"
            >Message
            <span class="required-icon" aria-hidden="true">*</span></label
          >
          <textarea
            name="message"
            id="message"
            class="input-message input"
            required
          ></textarea>
          <p class="error-message" aria-hidden="true" hidden>
            This field is required
          </p>
        </div>
        <div class="consent">
          <div>
            <input
              type="checkbox"
              name="consent"
              id="consent"
              class="input-checkbox"
              required
            />
            <label for="consent"
              >I consent to being contacted by the team
              <span class="required-icon" aria-hidden="true">*</span></label
            >
          </div>
          <p class="error-message" aria-hidden="true" hidden>
            To submit this form, please consent to being contacted
          </p>
        </div>
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
