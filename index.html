<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <main class="container">
      <h1>Contact Us</h1>
      <form>
        <div class="form-group">
          <label for="firstName"
            >First Name <span class="required-icon">*</span></label
          >
          <input type="text" name="firstName" id="firstName" required />
          <p class="error-message" aria-hidden="true">This field is required</p>
        </div>
        <div class="form-group">
          <label for="lastName"
            >Last Name <span class="required-icon">*</span></label
          >
          <input type="text" name="lastName" id="lastName" required />
          <p class="error-message" aria-hidden="true">This field is required</p>
        </div>
        <div class="form-group">
          <label for="email"
            >Email Address <span class="required-icon">*</span></label
          >
          <input type="email" name="email" id="email" required />
          <p class="error-message" aria-hidden="true">This field is required</p>
        </div>
        <fieldset>
          <legend>Query Type <span class="required-icon">*</span></legend>
          <div class="form-group">
            <input type="radio" name="queryType" id="generalQuery" />
            <label for="generalQuery">General Enquiry</label>
          </div>
          <div class="form-group">
            <input type="radio" name="queryType" id="supportQuery" />
            <label for="supportQuery">Support Request</label>
          </div>
          <p class="error-message" aria-hidden="true">
            Please select a query type
          </p>
        </fieldset>
        <div class="form-group">
          <label for="message"
            >Message <span class="required-icon">*</span></label
          >
          <textarea name="message" id="message"></textarea>
          <p class="error-message" aria-hidden="true">This field is required</p>
        </div>
        <div class="consent">
          <input type="checkbox" name="consent" id="consent" />
          <label for="consent">I consent to being contacted by the team</label>
          <p class="error-message" aria-hidden="true">
            To submit this form, please consent to being contacted
          </p>
        </div>
        <button type="submit">Submit</button>
      </form>
    </main>
    <div class="success-message">
      <h2>Message Sent!</h2>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>
    <!-- Contact Us

  First Name
  This field is required

  Last Name
  This field is required

  Email Address
  Please enter a valid email address
  This field is required

  Query Type
  General Enquiry
  Support Request
  Please select a query type

  Message
  This field is required

  I consent to being contacted by the team
  To submit this form, please consent to being contacted

  Submit

  Message Sent!
  Thanks for completing the form. We'll be in touch soon! -->
  </body>
</html>
